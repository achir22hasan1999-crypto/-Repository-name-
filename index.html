    <script>
      (function() {
        function shouldSuppress(err) {
          if (!err) return false;
          var msg = String((err && (err.message || err.reason || err)) || '');
          return (
            msg.indexOf('MetaMask') !== -1 ||
            msg.indexOf('ethereum') !== -1 ||
            msg.indexOf('wallet') !== -1 ||
            msg.indexOf('chrome-extension') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.error || event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
